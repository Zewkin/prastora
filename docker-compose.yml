version: "3.9"

services:
  db:
    image: mysql:8
    command: --disable-log-bin
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql

  joomla:
    image: joomla:5-apache
    depends_on:
      - db
    dns:
      - 10.42.42.4
    environment:
      JOOMLA_DB_HOST: db:3306
      JOOMLA_DB_USER: ${MYSQL_USER}
      JOOMLA_DB_PASSWORD: ${MYSQL_PASSWORD}
      JOOMLA_DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "${JOOMLA_HTTP_PORT:-8888}:80"
    volumes:
      - ./joomla:/var/www/html
    command: >
      bash -c "a2enmod headers && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "${PHPMYADMIN_HTTP_PORT:-8081}:80"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"

volumes:
  db_data:
