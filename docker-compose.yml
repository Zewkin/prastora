version: "3.9"

services:
  db:
    image: mysql:8
    command: --disable-log-bin
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql

  joomla:
    image: joomla:5-apache
    depends_on:
      - db
    restart: always
    dns:
      - 8.8.8.8
    environment:
      JOOMLA_DB_HOST: db:3306
      JOOMLA_DB_USER: ${MYSQL_USER}
      JOOMLA_DB_PASSWORD: ${MYSQL_PASSWORD}
      JOOMLA_DB_NAME: ${MYSQL_DATABASE}
      PHP_INI_SCAN_DIR: ":/usr/local/etc/php/conf.d.custom"
    ports:
      - "${JOOMLA_HTTP_PORT:-8888}:80"
    volumes:
      - ./joomla:/var/www/html
      - ./php-custom:/usr/local/etc/php/conf.d.custom
    command: >
      bash -c "echo 'opcache.enable=0' > /usr/local/etc/php/conf.d/zzz-disable-opcache.ini && a2enmod headers && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - db
    restart: always
    environment:
      PMA_HOST: db
    ports:
      - "${PHPMYADMIN_HTTP_PORT:-8081}:80"

  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"

volumes:
  db_data:
