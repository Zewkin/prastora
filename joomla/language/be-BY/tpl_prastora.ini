; About page fallbacks
TPL_PRASTORA_ABOUT_HERO_TITLE="Будучыня Беларусі пачынаецца з тых, хто выказваецца, прапануе рашэнні і дзейнічае."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH1="Prastora — анлайн-платформа, дзе беларусы разам абмяркоўваюць і дапрацоўваюць праекты Канстытуцыі, законаў і рэформаў Новой Беларусі."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH2="На prastora.info сабраныя тэксты ключавых дакументаў, іх тлумачэнні простай мовай і інструменты для зваротнай сувязі — ад каментароў да прапаноў па праўках. Наша місія — зрабіць удзел беларусаў у фарміраванні будучых правілаў як мага больш адкрытым і бяспечным, каб кожны мог уплываць на тое, як заўтра будзе жыць наша краіна. Мы злучаем экспертызу і жывы досвед грамадзян, каб закон сапраўды служыў людзям."
TPL_PRASTORA_ABOUT_CTA_SUPPORT="Падтрымаць Праект"
TPL_PRASTORA_ABOUT_CARD1_TITLE="Каманда, якая будуе будучую Беларусь"
TPL_PRASTORA_ABOUT_CARD1_TEXT="Мы працуем над тым, каб пераход да Новой Беларусі абапіраўся на прадуманыя рэформы, падрыхтаваныя законы і ўдзел грамадзян. У гэтай працы важныя сумленнасць, прафесіяналізм і гатоўнасць чуць розныя галасы."
TPL_PRASTORA_ABOUT_CARD2_TITLE="Супольнасць людзей, якім важная Беларусь"
TPL_PRASTORA_ABOUT_CARD2_TEXT="Вакол Prastora аб'ядноўваюцца беларусы з розным досведам — юрысты, аналітыкі, даследчыкі, валанцёры, аўтары ініцыятыў і праектаў. Нас аб'ядноўваюць павага да годнасці чалавека і імкненне ўплываць на рашэнні, ад якіх залежыць жыццё краіны."
TPL_PRASTORA_ABOUT_CARD3_TITLE="Прастора для ўдзелу"
TPL_PRASTORA_ABOUT_CARD3_TEXT="Prastora стварае ўмовы, у якіх улічваецца кожны голас. Тут можна чытаць дакументы, разбірацца ў складаных тэмах, дзяліцца меркаваннямі і ўплываць на тое, якія рашэнні атрымліваюць падтрымку."
TPL_PRASTORA_ABOUT_QUOTE_LINE1="Новая Беларусь — еўрапейская дэмакратычная краіна, дзе ўлада служыць людзям, закон аднолькавы для ўсіх, а кожны можа жыць, працаваць і планаваць будучыню без страху."
TPL_PRASTORA_ABOUT_QUOTE_LINE2="Частка гэтага вобраза нараджаецца ўжо сёння на prastora.info — у адкрытых абмеркаваннях і праектах рэформаў."
TPL_PRASTORA_ABOUT_QUOTE_LINE3="Якімі мы будзем заўтра, залежыць ад таго, як мы ўдзельнічаем і дзейнічаем сёння."
