; FAQ defaults
TPL_PRASTORA_FAQ_Q1="Як я магу ўдзельнічаць у абмеркаванні?"
TPL_PRASTORA_FAQ_A1="Проста выдзеліце частку тэксту і націсніце на іконку каментарыя з “+”, каб пакінуць каментар або прапанову."
TPL_PRASTORA_FAQ_Q2="Ці трэба рэгістравацца, каб пакінуць каментар?"
TPL_PRASTORA_FAQ_A2="Не. Вы можаце ўдзельнічаць ананімна. Калі хочаце — можна пакінуць email для апавяшчэнняў, але гэта неабавязкова."
TPL_PRASTORA_FAQ_Q3="Мой каментар не адлюстроўваецца — што рабіць?"
TPL_PRASTORA_FAQ_A3="Калі каментар яшчэ не з’явіўся, магчыма, яго правярае мадэратар. Дайце нам крыху часу — і ён з’явіцца на старонцы."
TPL_PRASTORA_FAQ_Q4="Ці магу я прапаноўваць свае тэмы або ідэі?"
TPL_PRASTORA_FAQ_A4="Так, вы можаце пакінуць прапанову да любога раздзела, альбо напісаць нам, калі тэма патрабуе асобнай дыскусіі."
TPL_PRASTORA_FAQ_Q5="Як вы забяспечваеце бяспеку ўдзельнікаў?"
TPL_PRASTORA_FAQ_A5="Мы не патрабуем рэгістрацыі або персанальных дадзеных. Усе каментарыі мадэруюцца, каб прадухіліць пераслед і хейт-спіч."
TPL_PRASTORA_FAQ_Q6="Я магу даведацца, што здарылася з маім каментаром?"
TPL_PRASTORA_FAQ_A6="Так, калі вы пакінулі email, мы паведамім пра статус каментара. Без email вы можаце сачыць за адказамі на старонцы."
TPL_PRASTORA_FAQ_Q7="Ці сапраўды мой каментар можа нешта змяніць?"
TPL_PRASTORA_FAQ_A7="Так, кожны каментар мае значэнне. Усе прапановы збіраюцца, аналізуюцца і перадаюцца экспертам, якія дапрацоўваюць дакументы. Мы фіксуем падтрымкі, частату і аргументацыю. Найбольш важныя ідэі ўключаем у новыя версіі і перадаём шырокай аўдыторыі."
TPL_PRASTORA_FAQ_FOOTER="Калі вы не знайшлі патрэбнай інфармацыі – напішыце нам. Мы заўсёды на сувязі і гатовыя дапамагчы."
TPL_PRASTORA_FAQ_DEFAULT_ANSWER="Адказ падрыхтоўваецца."
; Privacy page
TPL_PRASTORA_PRIVACY_LAST_UPDATED="Дата апошняга абнаўлення: 16 ліпеня 2025"
TPL_PRASTORA_PRIVACY_INTRO1="Мы ў «Прасторы» ставімся да вашай прыватнасці з павагай і адказнасцю."
TPL_PRASTORA_PRIVACY_INTRO2="Гэтая палітыка тлумачыць, якія даныя мы збіраем, як іх выкарыстоўваем, і якія правы маеце вы як карыстальнік платформы."
TPL_PRASTORA_PRIVACY_ITEM1_TITLE="1. Мінімум дадзеных — максімум павагі"
TPL_PRASTORA_PRIVACY_ITEM1_TEXT="Вы можаце карыстацца платформай без рэгістрацыі і ідэнтыфікацыі. Мы не патрабуем вашых асабістых дадзеных для ўдзелу ў абмеркаваннях або галасаваннях."
TPL_PRASTORA_PRIVACY_ITEM2_TITLE="2. E-mail — толькі па жаданні"
TPL_PRASTORA_PRIVACY_ITEM2_TEXT1="Вы можаце дадаткова пакінуць свой e-mail, каб атрымліваць апавяшчэнні пра адказы на вашы каментары. Гэта неабавязкова, і e-mail не бачны іншым карыстальнікам."
TPL_PRASTORA_PRIVACY_ITEM2_TEXT2="Мы не выкарыстоўваем ваш адрас электроннай пошты ў маркетынгавых мэтах і не перадаем яго трэцім асобам."
TPL_PRASTORA_PRIVACY_ITEM3_TEXT="Мы можам збіраць ананімную статыстыку пра выкарыстанне сайта (напрыклад, колькасць наведванняў, клікі), каб палепшыць працу платформы. Гэта не ўключае персанальных дадзеных."
TPL_PRASTORA_PRIVACY_ITEM4_TITLE="4. Файлы cookie"
TPL_PRASTORA_PRIVACY_ITEM4_TEXT="Платформа можа выкарыстоўваць тэхнічныя cookie-файлы для правільнай працы асобных функцый (напрыклад, захаванне мовы інтэрфейсу). Вы можаце абмежаваць іх праз налады свайго браўзера."
