; Home / featured override
TPL_PRASTORA_HERO_PRETITLE="мы верым што толькі разам мы"
TPL_PRASTORA_HERO_TITLE="Пабудуем Новую Беларусь"
TPL_PRASTORA_HERO_LEAD="Далучайся да «Прасторы» – платформы, дзе твой голас фарміруе будучыню нашай краіны. Удзельнічай у змястоўных абмеркаваннях канстытуцыі Новай Беларусі альбо праектаў законаў, прапануй свае праўкі ў рэформах і сачы за апошнімі навінамі заканадаўства."
TPL_PRASTORA_HERO_CTA_CONSTITUTION="Абмеркаваць Канстытуцыю"
TPL_PRASTORA_HERO_CTA_PROJECTS="Абмеркаваць Праекты"
TPL_PRASTORA_HERO_NOTICE="Беражыце сябе і сваю інфармацыю — прытрымлівайцеся простых правілаў анлайн-бяспекі."
TPL_PRASTORA_MOTO_INTRO="Новая Беларусь — гэта не нешта абстрактнае. Гэта – мы."
TPL_PRASTORA_MOTO_PARAGRAPH_ONE="Мы стварылі гэтую прастору, каб вярнуць грамадству права голасу. Каб кожны мог свабодна, без страху і разам абмяркоўваць будучыню краіны – і ўплываць на яе."
TPL_PRASTORA_MOTO_PARAGRAPH_TWO="Наша мэта – пабудаваць сучасную, дэмакратычную Беларусь, дзе закон абараняе людзей, а ўлада – абмежаваная і адказная."
TPL_PRASTORA_HOW_TITLE="Як гэта працуе?"
TPL_PRASTORA_HOW_STEP1="На «Прасторы» вы можаце далучыцца да абмеркавання законаў, рэформаў і Канстытуцыі – адкрыта, ананімна і без складаных рэгістрацый."
TPL_PRASTORA_HOW_STEP1_MORE="Усё, што вам трэба – гэта жаданне і зацікаўленасць сказаць сваё слова. Мы зрабілі працэс максімальна простым і зразумелым."
TPL_PRASTORA_HOW_STEP2_TITLE="Выдзеліце тэкст і націсніце «плюс» альбо пакіньце каментар да ўсей часткі тэксту."
TPL_PRASTORA_HOW_STEP2_MORE="Каб пакінуць свой каментар або прапанову, проста выдзеліце патрэбны фрагмент тэксту – і вы ўбачыце іконку “+”. Націсніце на яе, каб дадаць каментар канкрэтнага фрагмента. Таксама вы можаце пакінуць свой каментар да усяго кавалка тэксту націснуў на “каментаваць”."
TPL_PRASTORA_HOW_STEP3_TITLE="Пакіньце сваю прапанову або каментар"
TPL_PRASTORA_HOW_STEP3_MORE="У адкрытым полі вы можаце ўвесці свой тэкст. Гэта можа быць удакладненне, ідэя, крытычнае заўвага або проста пытанне. Будзьце канкрэтнымі і зразумелымі – гэта дапамагае іншым хутчэй зарыентавацца."
TPL_PRASTORA_HOW_STEP4_MORE="Калі вы пакінулі каментар да выдзеленага фрагмента, вы можаце вярнуцца да яго, націснуўшы на каментар або навёўшы на яго курсор."
TPL_PRASTORA_HOW_STEP5_TITLE="Абмяркуйце прапановы з іншымі ўдзельнікамі!"
TPL_PRASTORA_HOW_STEP5_MORE="Вы можаце адказваць на іншыя каментары, ставіць лайкі або дзяліцца сваім поглядам. Гэта адкрытае грамадскае абмеркаванне, і ваш голас – важны. Усё на самай справе так проста – і працуе!"
TPL_PRASTORA_HOW_STEP5_NOTE="Калі ў вас засталісь пытанні то вы можаце знайсці адказы на старонцы FAQ, альбо напісаць нам!"
TPL_PRASTORA_SECURITY_NOTICE_TITLE="Звярніце ўвагу: лічбавая бяспека – перадусім"
TPL_PRASTORA_SECURITY_NOTICE_LINE1="У акне для каментарыяў вы можаце ўвесці свой e-mail, каб атрымаць апавяшчэнне пра адказ або статус вашага паведамлення. Гэта не абавязкова."
TPL_PRASTORA_SECURITY_NOTICE_LINE2="Увядзіце пошту толькі калі ўпэўнены, што для вас гэта бяспечна. Мы клапоцімся пра вашу ананімнасць і даем магчымасць пакідаць каментары без аўтарызацыі."
TPL_PRASTORA_SECURITY_NOTICE_LINE3="Памятайце: ваша бяспека – галоўнае."
TPL_PRASTORA_PROJECTS_SECTION_TITLE="Апошнія праекты"
TPL_PRASTORA_PROJECTS_INTRO_FALLBACK="Невялікае апісанне праекта. Прастора – гэта адкрытая платформа, дзе беларусы могуць удзельнічаць у распрацоўцы законаў, рэформаў і Канстытуцыі новай Беларусі."
TPL_PRASTORA_PROJECTS_EMPTY="Праекты яшчэ не дададзены."
TPL_PRASTORA_PROJECTS_MORE="Больш праектаў"
TPL_PRASTORA_NEWS_SECTION_TITLE="Навіны"
TPL_PRASTORA_NEWS_ALL="Усе Навіны"
TPL_PRASTORA_PARTNERS_SECTION_TITLE="Партнеры Праекта"
TPL_PRASTORA_VIDEO_FALLBACK_TITLE="Назва Відэа"
TPL_PRASTORA_VIDEO_FALLBACK_DESC="Невялікае апісанне відэа. Прастора – гэта адкрытая платформа, дзе беларусы могуць удзельнічаць у распрацоўцы законаў, рэформаў і Канстытуцыі новай Беларусі."
