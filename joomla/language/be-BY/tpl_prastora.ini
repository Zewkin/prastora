TPL_PRASTORA_VIDEO_FALLBACK_DESC="Невялікае апісанне відэа. Прастора – гэта адкрытая платформа, дзе беларусы могуць удзельнічаць у распрацоўцы законаў, рэформаў і Канстытуцыі новай Беларусі."
