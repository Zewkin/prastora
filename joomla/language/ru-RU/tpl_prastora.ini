; About page fallbacks
TPL_PRASTORA_ABOUT_HERO_TITLE="Будущее Беларуси начинается с тех, кто высказывается, предлагает решения и действует."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH1="Prastora — онлайн-платформа, где беларусы вместе обсуждают и дорабатывают проекты Конституции, законов и реформ Новой Беларуси."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH2="На prastora.info собраны тексты ключевых документов, их объяснения простым языком и инструменты для обратной связи — от комментариев до предложений правок. Наша миссия — сделать участие беларусов в формировании будущих правил максимально открытым и безопасным, чтобы каждый мог влиять на то, как завтра будет жить наша страна. Мы соединяем экспертизу и живой опыт граждан, чтобы закон действительно служил людям."
TPL_PRASTORA_ABOUT_CTA_SUPPORT="Поддержать проект"
TPL_PRASTORA_ABOUT_CARD1_TITLE="Команда, которая строит будущую Беларусь"
TPL_PRASTORA_ABOUT_CARD1_TEXT="Мы работаем над тем, чтобы переход к Новой Беларуси опирался на продуманные реформы, подготовленные законы и участие граждан. В этой работе важны честность, профессионализм и готовность слышать разные голоса."
TPL_PRASTORA_ABOUT_CARD2_TITLE="Сообщество людей, которым важна Беларусь"
TPL_PRASTORA_ABOUT_CARD2_TEXT="Вокруг Prastora объединяются беларусы с разным опытом — юристы, аналитики, исследователи, волонтёры, авторы инициатив и проектов. Нас объединяют уважение к достоинству человека и стремление влиять на решения, от которых зависит жизнь страны."
TPL_PRASTORA_ABOUT_CARD3_TITLE="Пространство для участия"
TPL_PRASTORA_ABOUT_CARD3_TEXT="Prastora создаёт условия, в которых каждый голос учитывается. Здесь можно читать документы, разбираться в сложных темах, делиться мнением и влиять на то, какие решения получают поддержку."
TPL_PRASTORA_ABOUT_QUOTE_LINE1="Новая Беларусь — европейская демократическая страна, где власть служит людям, закон одинаков для всех, а каждый может жить, работать и планировать будущее без страха."
TPL_PRASTORA_ABOUT_QUOTE_LINE2="Часть этого образа рождается уже сегодня на prastora.info — в открытых обсуждениях и проектах реформ."
TPL_PRASTORA_ABOUT_QUOTE_LINE3="Какими мы будем завтра, зависит от того, как мы участвуем и действуем сегодня."
TPL_PRASTORA_ABOUT_QUOTE_LINE4=""
