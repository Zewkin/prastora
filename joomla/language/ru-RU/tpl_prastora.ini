; Home / featured override
TPL_PRASTORA_HERO_PRETITLE="мы верим, что только вместе мы"
TPL_PRASTORA_HERO_TITLE="Строим Новую Беларусь вместе"
TPL_PRASTORA_HERO_LEAD="На prastora.info вы можете выбрать интересующий вас документ, увидеть обновления, разобраться с помощью пояснений и оставить свои предложения. Ваши аргументы становятся частью общей работы над будущими правилами."
TPL_PRASTORA_HERO_CTA_CONSTITUTION="Обсудить Конституцию"
TPL_PRASTORA_HERO_CTA_PROJECTS="Обсудить Проекты"
TPL_PRASTORA_HERO_NOTICE="Берегите себя и свою информацию — придерживайтесь простых правил онлайн-безопасности."
TPL_PRASTORA_MOTO_INTRO="Новая Беларусь — это договорённость о новых правилах, по которым будет жить страна."
TPL_PRASTORA_MOTO_PARAGRAPH_ONE="Уже сегодня у нас есть возможность заранее обсудить, как будет устроена система сдержек и противовесов, как защищаются права, как работают суды и местное самоуправление."
TPL_PRASTORA_MOTO_PARAGRAPH_TWO="Prastora помогает готовиться к дню, когда появится шанс обновить эти правила. Здесь можно увидеть предложения в текстах, сравнить разные подходы и оставить свои аргументы, чтобы решения опирались на опыт общества."
TPL_PRASTORA_HOW_TITLE="Как это работает?"
TPL_PRASTORA_HOW_STEP1="На «Прасторе» вы можете присоединиться к обсуждению законов, реформ и Конституции — открыто, анонимно и без сложной регистрации."
TPL_PRASTORA_HOW_STEP1_MORE="Всё, что нужно, — желание и готовность высказать своё мнение. Мы сделали процесс максимально простым и понятным."
TPL_PRASTORA_HOW_STEP2_TITLE="Выделите текст и нажмите «плюс» либо оставьте комментарий к целому блоку."
TPL_PRASTORA_HOW_STEP2_MORE="Чтобы оставить комментарий или предложение, выделите нужный фрагмент текста — появится иконка “+”. Нажмите на неё, чтобы прокомментировать конкретное место. Можно оставить комментарий и ко всему блоку, нажав «комментировать»."
TPL_PRASTORA_HOW_STEP3_TITLE="Оставьте своё предложение или комментарий"
TPL_PRASTORA_HOW_STEP3_MORE="В открытом поле можно ввести текст — уточнение, идею, критику или вопрос. Будьте конкретны и понятны — так другим легче включиться."
TPL_PRASTORA_HOW_STEP4_MORE="Если вы оставили комментарий к выделенному фрагменту, вернуться к нему можно, нажав на комментарий или наведя на него курсор."
TPL_PRASTORA_HOW_STEP5_TITLE="Обсудите предложения с другими участниками!"
TPL_PRASTORA_HOW_STEP5_MORE="Вы можете отвечать на комментарии, ставить отметки «нравится» и делиться своим взглядом. Это открытая общественная дискуссия, и ваш голос важен. Всё действительно просто — и работает!"
TPL_PRASTORA_HOW_STEP5_NOTE="Если остались вопросы, загляните на страницу FAQ или напишите нам!"
TPL_PRASTORA_SECURITY_NOTICE_TITLE="Обратите внимание: цифровая безопасность — прежде всего"
TPL_PRASTORA_SECURITY_NOTICE_LINE1="В форме комментариев можно указать e-mail, чтобы получать уведомления об ответах или статусе сообщения. Это необязательно."
TPL_PRASTORA_SECURITY_NOTICE_LINE2="Оставляйте почту только если уверены, что это безопасно. Мы заботимся о вашей анонимности и даём возможность комментировать без авторизации."
TPL_PRASTORA_SECURITY_NOTICE_LINE3="Помните: ваша безопасность — главное."
TPL_PRASTORA_PROJECTS_SECTION_TITLE="Последние проекты"
TPL_PRASTORA_PROJECTS_INTRO_FALLBACK="Короткое описание проекта. «Прастора» — открытая платформа, где белорусы могут участвовать в разработке законов, реформ и Конституции новой Беларуси."
