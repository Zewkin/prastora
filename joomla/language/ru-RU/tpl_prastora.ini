; FAQ defaults
TPL_PRASTORA_FAQ_Q1="Как я могу участвовать в обсуждении?"
TPL_PRASTORA_FAQ_A1="Просто выделите часть текста и нажмите на иконку комментария с “+”, чтобы оставить комментарий или предложение."
TPL_PRASTORA_FAQ_Q2="Нужно ли регистрироваться, чтобы оставить комментарий?"
TPL_PRASTORA_FAQ_A2="Нет. Вы можете участвовать анонимно. Если хотите — оставьте email для уведомлений, но это необязательно."
TPL_PRASTORA_FAQ_Q3="Мой комментарий не отображается — что делать?"
TPL_PRASTORA_FAQ_A3="Если комментарий ещё не появился, возможно, его проверяет модератор. Дайте нам немного времени — и он появится на странице."
TPL_PRASTORA_FAQ_Q4="Могу ли я предлагать свои темы или идеи?"
TPL_PRASTORA_FAQ_A4="Да, вы можете оставить предложение к любому разделу или написать нам, если теме нужна отдельная дискуссия."
TPL_PRASTORA_FAQ_Q5="Как вы обеспечиваете безопасность участников?"
TPL_PRASTORA_FAQ_A5="Мы не требуем регистрации или персональных данных. Все комментарии модерируются, чтобы предотвратить травлю и хейт-спич."
TPL_PRASTORA_FAQ_Q6="Могу ли я узнать, что произошло с моим комментарием?"
TPL_PRASTORA_FAQ_A6="Да, если вы оставили email, мы сообщим о статусе комментария. Без email можно следить за ответами на странице."
TPL_PRASTORA_FAQ_Q7="Действительно ли мой комментарий может что-то изменить?"
TPL_PRASTORA_FAQ_A7="Да, каждый комментарий важен. Все предложения собираются, анализируются и передаются экспертам, которые дорабатывают документы. Мы фиксируем поддержку, частоту и аргументацию. Самые значимые идеи попадают в новые версии и выносятся широкой аудитории."
TPL_PRASTORA_FAQ_FOOTER="Если вы не нашли нужную информацию — напишите нам. Мы всегда на связи и готовы помочь."
TPL_PRASTORA_FAQ_DEFAULT_ANSWER="Ответ готовится."

; Privacy page
TPL_PRASTORA_PRIVACY_LAST_UPDATED="Дата последнего обновления: 16 июля 2025"
TPL_PRASTORA_PRIVACY_INTRO1="Мы в «Прасторе» относимся к вашей приватности с уважением и ответственностью."
TPL_PRASTORA_PRIVACY_INTRO2="Эта политика объясняет, какие данные мы собираем, как их используем и какие права есть у вас как у пользователя платформы."
TPL_PRASTORA_PRIVACY_ITEM1_TITLE="1. Минимум данных — максимум уважения"
TPL_PRASTORA_PRIVACY_ITEM1_TEXT="Вы можете пользоваться платформой без регистрации и идентификации. Мы не требуем персональных данных для участия в обсуждениях или голосованиях."
TPL_PRASTORA_PRIVACY_ITEM2_TITLE="2. E-mail — только по желанию"
TPL_PRASTORA_PRIVACY_ITEM2_TEXT1="Вы можете дополнительно оставить свой e-mail, чтобы получать уведомления об ответах на ваши комментарии. Это необязательно, и адрес не виден другим пользователям."
TPL_PRASTORA_PRIVACY_ITEM2_TEXT2="Мы не используем ваш e-mail в маркетинговых целях и не передаём его третьим лицам."
TPL_PRASTORA_PRIVACY_ITEM3_TEXT="Мы можем собирать анонимную статистику использования сайта (например, количество посещений, клики), чтобы улучшать платформу. Это не включает персональные данные."
TPL_PRASTORA_PRIVACY_ITEM4_TITLE="4. Файлы cookie"
TPL_PRASTORA_PRIVACY_ITEM4_TEXT="Платформа может использовать технические cookie для корректной работы функций (например, сохранения языка интерфейса). Вы можете ограничить их в настройках браузера."
TPL_PRASTORA_PRIVACY_FALLBACK_TITLE="Политика приватности"

