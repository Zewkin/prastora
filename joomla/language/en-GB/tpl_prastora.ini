; About page fallbacks
TPL_PRASTORA_ABOUT_HERO_TITLE="We believe the future of Belarus belongs to its citizens."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH1="That’s why we are transforming kanstytucyja.online into a space for free voices, collective decisions and fair laws."
TPL_PRASTORA_ABOUT_HERO_PARAGRAPH2="Our mission is to create an open, safe place where all Belarusians can help shape laws, reforms and the Constitution of the New Belarus. We return citizens their voice and influence over the country’s future."
TPL_PRASTORA_ABOUT_CTA_SUPPORT="Support the Project"
TPL_PRASTORA_ABOUT_CARD1_TITLE="We care. We speak up. We act."
TPL_PRASTORA_ABOUT_CARD1_TEXT="We are a community for whom Belarus’s future is not abstract. We unite so that everyone can participate: openly, safely, thoughtfully. We don’t wait for change — we create it."
TPL_PRASTORA_ABOUT_CARD2_TITLE="Those who did not step aside from challenges."
TPL_PRASTORA_ABOUT_CARD2_TEXT="This platform was built by people who believe law must serve people. We are here to listen, propose, debate and build new solutions together with you."
TPL_PRASTORA_ABOUT_CARD3_TITLE="For everyone who wants better — and is ready to work for it."
TPL_PRASTORA_ABOUT_CARD3_TEXT="We did not walk away from responsibility. We chose the hard but necessary path — to speak openly, propose solutions and search for common ground. Belarus starts with those who are ready to stand together."
TPL_PRASTORA_ABOUT_QUOTE_LINE1="The New Belarus is not an idea from the future. It is us — citizens who refuse to be silent."
TPL_PRASTORA_ABOUT_QUOTE_LINE2="We created this platform so everyone can openly participate in shaping the country’s future: without fear, with respect and in dialogue."
TPL_PRASTORA_ABOUT_QUOTE_LINE3="We believe in a Belarus where law serves people and power acts transparently and responsibly."
TPL_PRASTORA_ABOUT_QUOTE_LINE4="And we know: change starts not “from above”, but with us."
TPL_PRASTORA_ABOUT_MOTTO_TITLE="International expertise for Belarus’s future."
TPL_PRASTORA_ABOUT_MOTTO_P1="The draft Constitution of the New Belarus is developed with the help of international consultants — experts in constitutional law, democratic transitions and public governance."
TPL_PRASTORA_ABOUT_MOTTO_P2="These experts provided independent support and helped adapt the draft to international standards of democracy, human rights and transparent government."
TPL_PRASTORA_ABOUT_MOTTO_HIGHLIGHT="Their experience is the foundation of a document that fits Belarusian needs and universal principles of the rule of law."
TPL_PRASTORA_ABOUT_TEAM_NAME="Dr. Wolfgang BENEDEK"
TPL_PRASTORA_ABOUT_TEAM_ROLE="Honorary Professor of International Law, Institute of International Law"
TPL_PRASTORA_ABOUT_SECTION_STORY="Who are we?"
TPL_PRASTORA_ABOUT_SECTION_PARTNERS="Project Partners"

; FAQ defaults
TPL_PRASTORA_FAQ_Q1="How can I take part in the discussion?"
TPL_PRASTORA_FAQ_A1="Highlight a fragment and click the “+” comment icon to leave a comment or suggestion."
TPL_PRASTORA_FAQ_Q2="Do I need to register to leave a comment?"
TPL_PRASTORA_FAQ_A2="No. You can participate anonymously. If you wish, leave an email for notifications, but it’s optional."
TPL_PRASTORA_FAQ_Q3="My comment doesn’t show up — what should I do?"
TPL_PRASTORA_FAQ_A3="If the comment hasn’t appeared yet, it may still be under moderation. Give us a little time and it will show up on the page."
TPL_PRASTORA_FAQ_Q4="Can I suggest my own topics or ideas?"
TPL_PRASTORA_FAQ_A4="Yes, you can suggest ideas for any section or write to us if a topic needs a separate discussion."
TPL_PRASTORA_FAQ_Q5="How do you keep participants safe?"
TPL_PRASTORA_FAQ_A5="We don’t require registration or personal data. All comments are moderated to prevent harassment and hate speech."
TPL_PRASTORA_FAQ_Q6="Can I find out what happened to my comment?"
TPL_PRASTORA_FAQ_A6="Yes, if you left an email we’ll notify you about its status. Without email you can follow replies directly on the page."
TPL_PRASTORA_FAQ_Q7="Can my comment really change anything?"
TPL_PRASTORA_FAQ_A7="Yes, every comment matters. All suggestions are collected, analyzed and passed to experts who refine the documents. We track support, frequency and arguments; the most important ideas are reflected in new versions and shared widely."
TPL_PRASTORA_FAQ_FOOTER="Didn’t find what you need? Write to us. We’re always in touch and ready to help."
TPL_PRASTORA_FAQ_DEFAULT_ANSWER="Answer coming soon."

; Privacy page
TPL_PRASTORA_PRIVACY_LAST_UPDATED="Last updated: 16 July 2025"
TPL_PRASTORA_PRIVACY_INTRO1="At “Prastora” we treat your privacy with respect and responsibility."
TPL_PRASTORA_PRIVACY_INTRO2="This policy explains what data we collect, how we use it and what rights you have as a platform user."
TPL_PRASTORA_PRIVACY_ITEM1_TITLE="1. Minimum data — maximum respect"
TPL_PRASTORA_PRIVACY_ITEM1_TEXT="You can use the platform without registration or identification. We don’t ask for personal data to join discussions or votes."
TPL_PRASTORA_PRIVACY_ITEM2_TITLE="2. Email — only if you wish"
TPL_PRASTORA_PRIVACY_ITEM2_TEXT1="You may optionally leave an email to receive notifications about replies. It’s optional and invisible to other users."
TPL_PRASTORA_PRIVACY_ITEM2_TEXT2="We never use your email for marketing or share it with third parties."
TPL_PRASTORA_PRIVACY_ITEM3_TEXT="We may collect anonymous usage statistics (visits, clicks) to improve the platform. This data doesn’t include personal information."
TPL_PRASTORA_PRIVACY_ITEM4_TITLE="4. Cookies"
TPL_PRASTORA_PRIVACY_ITEM4_TEXT="The platform may use technical cookies to keep certain features working (for example, remembering the interface language). You can limit them in your browser settings."
TPL_PRASTORA_PRIVACY_FALLBACK_TITLE="Privacy Policy"

