; Home / featured override
TPL_PRASTORA_HERO_PRETITLE="we believe only together we can"
TPL_PRASTORA_HERO_TITLE="Build a New Belarus"
TPL_PRASTORA_HERO_LEAD="Join “Prastora” — the platform where your voice helps shape the future of Belarus. Take part in meaningful discussions on the Constitution for the New Belarus, contribute to drafting laws, suggest amendments to reforms, and stay informed with the latest legislative updates."
TPL_PRASTORA_HERO_CTA_CONSTITUTION="Discuss the Constitution"
TPL_PRASTORA_HERO_CTA_PROJECTS="Draft laws"
TPL_PRASTORA_HERO_NOTICE="Protect yourself and your information — follow simple digital-security rules."
TPL_PRASTORA_MOTO_INTRO="A New Belarus is not abstract. It is us."
TPL_PRASTORA_MOTO_PARAGRAPH_ONE="We created this space to give society its voice back — so everyone can freely, fearlessly, and collectively discuss the country’s future and shape it."
TPL_PRASTORA_MOTO_PARAGRAPH_TWO="Our goal is to build a modern, democratic Belarus where the law protects people and power remains limited and accountable."
TPL_PRASTORA_HOW_TITLE="How does it work?"
TPL_PRASTORA_HOW_STEP1="On “Prastora” you can join debates about laws, reforms and the Constitution — openly, anonymously and without complicated registration."
TPL_PRASTORA_HOW_STEP1_MORE="All you need is a desire to speak up. We made the process as simple and clear as possible."
TPL_PRASTORA_HOW_STEP2_TITLE="Highlight text and click “plus”, or comment on the whole section."
TPL_PRASTORA_HOW_STEP2_MORE="To leave a comment or suggestion, highlight the needed fragment — you’ll see a “+” icon. Click it to comment on a specific place. You can also comment on the entire block by choosing “comment”."
TPL_PRASTORA_HOW_STEP3_TITLE="Share your proposal or comment"
TPL_PRASTORA_HOW_STEP3_MORE="Use the open field to describe your idea, clarification, critique or question. Be concrete so others can react faster."
TPL_PRASTORA_HOW_STEP4_MORE="If you left a comment on a highlighted fragment, return to it by clicking the comment or hovering over it."
TPL_PRASTORA_HOW_STEP5_TITLE="Discuss proposals with other participants!"
TPL_PRASTORA_HOW_STEP5_MORE="Reply to comments, leave likes, share your view. This is an open civic dialogue and your voice matters. It’s really that simple — and it works!"
TPL_PRASTORA_HOW_STEP5_NOTE="Still have questions? Check the FAQ page or drop us a line!"
TPL_PRASTORA_SECURITY_NOTICE_TITLE="Attention: digital security first"
TPL_PRASTORA_SECURITY_NOTICE_LINE1="In the comment form you may leave an e-mail to get notifications about replies or status updates. This is optional."
TPL_PRASTORA_SECURITY_NOTICE_LINE2="Provide an email only if you are sure it is safe. We care about your anonymity and let you comment without signing in."
TPL_PRASTORA_SECURITY_NOTICE_LINE3="Remember: your safety comes first."
